name: Daily Job Aggregator

on:
  schedule:
    # Run every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions UI

jobs:
  aggregate:
    name: Scrape, Filter & Notify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-aggregator/requirements.txt

      - name: Install dependencies
        run: pip install -r job-aggregator/requirements.txt

      - name: Run job aggregator pipeline
        working-directory: job-aggregator
        run: python main.py
