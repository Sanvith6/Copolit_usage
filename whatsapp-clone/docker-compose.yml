version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: wa-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: wa-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/whatsapp
      - JWT_SECRET=supersecretjwt
      - PORT=5000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: wa-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
